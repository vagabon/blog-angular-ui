<app-list-modal-form
    [isOpen]="isFormModalOpen()"
    [userConnected]="authService.userConnected()"
    [listSelected]="todolistService.todolistSelected()"
    (callback)="todolistService.addTodolist($event)"
/>

<app-list-modal-delete
    [item]="todolistService.todolistSelected()!"
    (callback)="todolistService.deleteTodolist()"
/>
