<div class="content">
    <div #checkbox class="checkbox">
        <dsv-form-signal-checkbox
            [form]="readForm"
            fieldName="checked"
            [withLabel]="false"
            (callbackChange)="callback.emit(todolistItem()!)"
        />
    </div>
    <div class="name" (click)="triggerCheckbox()" (keyup)="triggerCheckbox()">
        @if (update()) {
            <dsv-form-signal-input
                [form]="readForm"
                fieldName="name"
                [type]="'text'"
                [withLabel]="false"
                (callbackSend)="doChange()"
            />
        } @else {
            {{ todolistItem()?.name }}
        }
    </div>
    <div class="actions">
        <dsv-button color="secondary" variant="text" icon="ri-edit-line" (callback)="update.set(!update())" />
        <dsv-button
            color="error"
            variant="text"
            icon="ri-delete-bin-7-line"
            (callback)="callbackDelete.emit(todolistItem()!)"
        />
    </div>
</div>
<div class="divider"></div>
